$kind: http-request
url: "{{baseUrl}}/api/mobile"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Status skal være 200
      pm.test("MOBILE-01: Statuskode er 200", function () {
          pm.response.to.have.status(200);
      });

      // Mobilnummeret skal være tekst med præcis 8 cifre
      pm.test("MOBILE-01: Mobilnummer indeholder præcis 8 cifre", function () {
          const body = pm.response.json();

          // Svaret skal have feltet mobile_phone_number
          pm.expect(body).to.have.property("mobile_phone_number");
          pm.expect(body.mobile_phone_number).to.be.a("string");

          const mobile = body.mobile_phone_number;

          // Nummeret skal have 8 tegn
          pm.expect(mobile.length).to.equal(8);

          const allowedDigits = "0123456789";

          // Hvert tegn skal være et ciffer
          for (const character of mobile) {
              pm.expect(allowedDigits).to.include(character);
          }
      });

      // Mobilnummeret skal starte med et tilladt præfiks
      pm.test("MOBILE-01: Mobilnummer har et tilladt præfiks", function () {
          const body = pm.response.json();

          pm.expect(body.mobile_phone_number).to.be.a("string");

          const mobile = body.mobile_phone_number;

          // Tilladte præfikser fra opgavebeskrivelsen
          const allowedPrefixes = [
              "2",
              "30", "31", "40", "41", "42",
              "50", "51", "52", "53", "60", "61",
              "71", "81", "91", "92", "93",

              "342", "344", "345", "346", "347", "348", "349",
              "356", "357", "359", "362", "365", "366", "389", "398",
              "431", "441", "462", "466", "468", "472", "474",
              "476", "478", "485", "486", "488", "489",
              "493", "494", "495", "496", "498", "499",
              "542", "543", "545", "551", "552", "556",
              "571", "572", "573", "574", "577", "579",
              "584", "586", "587", "589", "597", "598",
              "627", "629", "641", "649", "658",
              "662", "663", "664", "665", "667",
              "692", "693", "694", "697",
              "771", "772", "782", "783", "785", "786",
              "788", "789", "826", "827", "829"
          ];

          // Vi har endnu ikke fundet et tilladt præfiks
          let hasAllowedPrefix = false;

          // Undersøger om nummeret starter med et af præfikserne
          for (const prefix of allowedPrefixes) {
              if (mobile.startsWith(prefix)) {
                  hasAllowedPrefix = true;
                  break;
              }
          }

          // Mindst ét præfiks skal passe
          pm.expect(hasAllowedPrefix).to.equal(true);
      });
    language: text/javascript
order: 1792067004876
