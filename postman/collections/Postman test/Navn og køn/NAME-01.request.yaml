$kind: http-request
url: "{{baseUrl}}/api/name-gender"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Status skal være 200
      pm.test("NAME-01: Statuskode er 200", function () {
          pm.response.to.have.status(200);
      });

      // Svaret skal være JSON og indeholde ét objekt
      pm.test("NAME-01: Svaret er et JSON-objekt", function () {
          const contentType = pm.response.headers.get("Content-Type");

          pm.expect(contentType).to.be.a("string");
          pm.expect(contentType.toLowerCase()).to.include("application/json");

          const body = pm.response.json();

          pm.expect(body).to.be.an("object");
          pm.expect(body).to.not.be.an("array");
      });

      // Fornavnet skal findes og indeholde tekst
      pm.test("NAME-01: Fornavn findes og er ikke tomt", function () {
          const body = pm.response.json();

          pm.expect(body).to.have.property("first_name");
          pm.expect(body.first_name).to.be.a("string");

          // trim fjerner mellemrum i starten og slutningen
          pm.expect(body.first_name.trim().length).to.be.above(0);
      });

      // Efternavnet skal findes og indeholde tekst
      pm.test("NAME-01: Efternavn findes og er ikke tomt", function () {
          const body = pm.response.json();

          pm.expect(body).to.have.property("last_name");
          pm.expect(body.last_name).to.be.a("string");
          pm.expect(body.last_name.trim().length).to.be.above(0);
      });

      // Køn skal findes og have en tilladt værdi
      pm.test("NAME-01: Køn har en tilladt værdi", function () {
          const body = pm.response.json();

          pm.expect(body).to.have.property("gender");
          pm.expect(body.gender).to.be.a("string");
          pm.expect(body.gender).to.be.oneOf(["female", "male"]);
      });
    language: text/javascript
order: 1792065532448
