$kind: http-request
url: "{{baseUrl}}/api/name-gender-dob"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Status skal være 200
      pm.test("NAME-02: Statuskode er 200", function () {
          pm.response.to.have.status(200);
      });

      // Svaret skal være JSON og indeholde ét objekt
      pm.test("NAME-02: Svaret er et JSON-objekt", function () {
          const contentType = pm.response.headers.get("Content-Type");

          pm.expect(contentType).to.be.a("string");
          pm.expect(contentType.toLowerCase()).to.include("application/json");

          const body = pm.response.json();

          pm.expect(body).to.be.an("object");
          pm.expect(body).to.not.be.an("array");
      });

      // Begge navne skal findes og indeholde tekst
      pm.test("NAME-02: Fornavn og efternavn er udfyldt", function () {
          const body = pm.response.json();
          const fields = ["first_name", "last_name"];

          for (const field of fields) {
              pm.expect(body).to.have.property(field);
              pm.expect(body[field]).to.be.a("string");
              pm.expect(body[field].trim().length).to.be.above(0);
          }
      });

      // Køn skal findes og have en tilladt værdi
      pm.test("NAME-02: Køn har en tilladt værdi", function () {
          const body = pm.response.json();

          pm.expect(body).to.have.property("gender");
          pm.expect(body.gender).to.be.a("string");
          pm.expect(body.gender).to.be.oneOf(["female", "male"]);
      });

      // Fødselsdatoen skal have formatet YYYY-MM-DD og eksistere i kalenderen
      pm.test("NAME-02: Fødselsdato har korrekt format og er gyldig", function () {
          const body = pm.response.json();

          pm.expect(body).to.have.property("date_of_birth");
          pm.expect(body.date_of_birth).to.be.a("string");

          const dob = body.date_of_birth;

          // Datoen skal have ti tegn med bindestreger på de rigtige pladser
          pm.expect(dob.length).to.equal(10);
          pm.expect(dob.charAt(4)).to.equal("-");
          pm.expect(dob.charAt(7)).to.equal("-");

          const yearText = dob.substring(0, 4);
          const monthText = dob.substring(5, 7);
          const dayText = dob.substring(8, 10);

          // Alt andet end bindestregerne skal være cifre
          const allowedDigits = "0123456789";
          const dateDigits = yearText + monthText + dayText;

          for (const character of dateDigits) {
              pm.expect(allowedDigits).to.include(character);
          }

          const year = Number(yearText);
          const month = Number(monthText);
          const day = Number(dayText);

          // Kontrollerer kalenderåret og måneden
          pm.expect(year).to.be.within(1, 9999);
          pm.expect(month).to.be.within(1, 12);

          const daysInMonth = [
              31, 28, 31, 30, 31, 30,
              31, 31, 30, 31, 30, 31
          ];

          // Et år er skudår, hvis det er deleligt med 4.
          // År delelige med 100 skal også være delelige med 400.
          const isLeapYear = year % 4 === 0
              && (year % 100 !== 0 || year % 400 === 0);

          if (isLeapYear) {
              daysInMonth[1] = 29;
          }

          // Dagen skal eksistere i den pågældende måned
          pm.expect(day).to.be.within(1, daysInMonth[month - 1]);
      });
    language: text/javascript
