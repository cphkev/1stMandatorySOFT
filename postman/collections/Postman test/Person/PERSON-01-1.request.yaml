$kind: http-request
name: PERSON-01
url: "{{baseUrl}}/api/person"
method: GET
scripts:
  - type: afterResponse
    code: |-
      // Status skal være 200
      pm.test("PERSON-01: Statuskode er 200", function () {
          pm.response.to.have.status(200);
      });

      // Svaret skal være JSON og indeholde ét objekt
      pm.test("PERSON-01: Svaret er et JSON-objekt", function () {
          const contentType = pm.response.headers.get("Content-Type");

          pm.expect(contentType).to.be.a("string");
          pm.expect(contentType.toLowerCase()).to.include("application/json");

          const body = pm.response.json();

          pm.expect(body).to.be.an("object");
          pm.expect(body).to.not.be.an("array");
      });

      // Alle personens tekstfelter skal findes og være udfyldt
      pm.test("PERSON-01: Alle personfelter er udfyldt", function () {
          const body = pm.response.json();

          const fields = [
              "cpr",
              "first_name",
              "last_name",
              "gender",
              "date_of_birth",
              "mobile_phone_number"
          ];

          for (const field of fields) {
              pm.expect(body).to.have.property(field);
              pm.expect(body[field]).to.be.a("string");
              pm.expect(body[field].trim().length).to.be.above(0);
          }

          // Adressen skal være et separat objekt
          pm.expect(body).to.have.property("address");
          pm.expect(body.address).to.be.an("object");
          pm.expect(body.address).to.not.be.an("array");
      });

      // CPR skal indeholde præcis ti cifre
      pm.test("PERSON-01: CPR indeholder præcis 10 cifre", function () {
          const body = pm.response.json();

          pm.expect(body.cpr).to.be.a("string");
          pm.expect(body.cpr.length).to.equal(10);

          const allowedDigits = "0123456789";

          for (const character of body.cpr) {
              pm.expect(allowedDigits).to.include(character);
          }
      });

      // CPR's sidste ciffer skal passe med kønnet
      pm.test("PERSON-01: CPR passer med kønnet", function () {
          const body = pm.response.json();

          pm.expect(body.gender).to.be.a("string");
          pm.expect(body.gender).to.be.oneOf(["female", "male"]);
          pm.expect(body.cpr).to.be.a("string");

          const lastDigit = Number(body.cpr.charAt(9));

          if (body.gender === "female") {
              pm.expect(lastDigit % 2).to.equal(0);
          } else {
              pm.expect(lastDigit % 2).to.equal(1);
          }
      });

      // Fødselsdatoen skal have korrekt format og eksistere i kalenderen
      pm.test("PERSON-01: Fødselsdato er gyldig", function () {
          const body = pm.response.json();

          pm.expect(body.date_of_birth).to.be.a("string");

          const dob = body.date_of_birth;

          pm.expect(dob.length).to.equal(10);
          pm.expect(dob.charAt(4)).to.equal("-");
          pm.expect(dob.charAt(7)).to.equal("-");

          const yearText = dob.substring(0, 4);
          const monthText = dob.substring(5, 7);
          const dayText = dob.substring(8, 10);

          const allowedDigits = "0123456789";
          const dateDigits = yearText + monthText + dayText;

          for (const character of dateDigits) {
              pm.expect(allowedDigits).to.include(character);
          }

          const year = Number(yearText);
          const month = Number(monthText);
          const day = Number(dayText);

          pm.expect(year).to.be.within(1, 9999);
          pm.expect(month).to.be.within(1, 12);

          const daysInMonth = [
              31, 28, 31, 30, 31, 30,
              31, 31, 30, 31, 30, 31
          ];

          const isLeapYear = year % 4 === 0
              && (year % 100 !== 0 || year % 400 === 0);

          if (isLeapYear) {
              daysInMonth[1] = 29;
          }

          pm.expect(day).to.be.within(1, daysInMonth[month - 1]);
      });

      // CPR og fødselsdato skal passe sammen i samme person
      pm.test("PERSON-01: CPR matcher fødselsdatoen", function () {
          const body = pm.response.json();

          pm.expect(body.cpr).to.be.a("string");
          pm.expect(body.date_of_birth).to.be.a("string");

          const dob = body.date_of_birth;

          const day = dob.substring(8, 10);
          const month = dob.substring(5, 7);
          const year = dob.substring(2, 4);

          const expectedCprDate = day + month + year;

          pm.expect(body.cpr.substring(0, 6)).to.equal(expectedCprDate);
      });

      // Alle felterne inde i adresseobjektet skal være udfyldt
      pm.test("PERSON-01: Alle adressefelter er udfyldt", function () {
          const body = pm.response.json();

          pm.expect(body.address).to.be.an("object");

          const address = body.address;

          const fields = [
              "street",
              "number",
              "floor",
              "door",
              "postal_code",
              "town"
          ];

          for (const field of fields) {
              pm.expect(address).to.have.property(field);
              pm.expect(address[field]).to.be.a("string");
              pm.expect(address[field].trim().length).to.be.above(0);
          }
      });

      // Vejnavnet skal kun indeholde bogstaver
      pm.test("PERSON-01: Vejnavnet indeholder kun bogstaver", function () {
          const body = pm.response.json();

          pm.expect(body.address).to.be.an("object");
          pm.expect(body.address.street).to.be.a("string");

          // Samme fortolkning som ADDRESS-01: Unicode-bogstaver
          pm.expect(body.address.street).to.match(/^\p{L}+$/u);
      });

      // Husnummeret skal være 1–999 med et valgfrit stort bogstav
      pm.test("PERSON-01: Husnummer er gyldigt", function () {
          const body = pm.response.json();

          pm.expect(body.address).to.be.an("object");

          const houseNumber = body.address.number;

          pm.expect(houseNumber).to.be.a("string");
          pm.expect(houseNumber).to.match(/^[0-9]+[A-Z]?$/);

          const numericPart = houseNumber.replace(/[A-Z]$/, "");

          pm.expect(Number(numericPart)).to.be.within(1, 999);
      });

      // Etagen skal være stue eller 1–99
      pm.test("PERSON-01: Etage er gyldig", function () {
          const body = pm.response.json();

          pm.expect(body.address).to.be.an("object");

          const floor = body.address.floor;

          pm.expect(floor).to.be.a("string");

          if (floor === "st") {
              pm.expect(floor).to.equal("st");
          } else {
              pm.expect(floor).to.match(/^[0-9]+$/);
              pm.expect(Number(floor)).to.be.within(1, 99);
          }
      });

      // Døren skal passe til en af de tilladte varianter
      pm.test("PERSON-01: Dør har et tilladt format", function () {
          const body = pm.response.json();

          pm.expect(body.address).to.be.an("object");

          const door = body.address.door;

          pm.expect(door).to.be.a("string");

          const namedDoors = ["th", "mf", "tv"];

          if (namedDoors.includes(door)) {
              pm.expect(door).to.be.oneOf(namedDoors);

          } else if (/^[0-9]+$/.test(door)) {
              pm.expect(Number(door)).to.be.within(1, 50);

          } else {
              // Lille bogstav, eventuel bindestreg og 1–3 cifre
              pm.expect(door).to.match(/^[a-z]-?[0-9]{1,3}$/);
          }
      });

      // Mobilnummeret skal indeholde præcis otte cifre
      pm.test("PERSON-01: Mobilnummer indeholder præcis 8 cifre", function () {
          const body = pm.response.json();

          pm.expect(body.mobile_phone_number).to.be.a("string");

          const mobile = body.mobile_phone_number;

          pm.expect(mobile.length).to.equal(8);

          const allowedDigits = "0123456789";

          for (const character of mobile) {
              pm.expect(allowedDigits).to.include(character);
          }
      });

      // Mobilnummeret skal starte med et præfiks fra opgaven
      pm.test("PERSON-01: Mobilnummer har et tilladt præfiks", function () {
          const body = pm.response.json();

          pm.expect(body.mobile_phone_number).to.be.a("string");

          const mobile = body.mobile_phone_number;

          const allowedPrefixes = [
              "2",
              "30", "31", "40", "41", "42",
              "50", "51", "52", "53", "60", "61",
              "71", "81", "91", "92", "93",

              "342", "344", "345", "346", "347", "348", "349",
              "356", "357", "359", "362", "365", "366", "389", "398",
              "431", "441", "462", "466", "468", "472", "474",
              "476", "478", "485", "486", "488", "489",
              "493", "494", "495", "496", "498", "499",
              "542", "543", "545", "551", "552", "556",
              "571", "572", "573", "574", "577", "579",
              "584", "586", "587", "589", "597", "598",
              "627", "629", "641", "649", "658",
              "662", "663", "664", "665", "667",
              "692", "693", "694", "697",
              "771", "772", "782", "783", "785", "786",
              "788", "789", "826", "827", "829"
          ];

          let hasAllowedPrefix = false;

          for (const prefix of allowedPrefixes) {
              if (mobile.startsWith(prefix)) {
                  hasAllowedPrefix = true;
                  break;
              }
          }

          pm.expect(hasAllowedPrefix).to.equal(true);
      });


      pm.test("PERSON-01: Postnummer er fire cifre", function () {
          const address = pm.response.json().address;

          pm.expect(address.postal_code).to.be.a("string");
          pm.expect(address.postal_code).to.match(/^[0-9]{4}$/);

          pm.expect(address.town).to.be.a("string");
          pm.expect(address.town.trim().length).to.be.above(0);
      });
    language: text/javascript
order: 1792321911451
