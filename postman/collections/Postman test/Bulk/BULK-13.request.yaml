$kind: http-request
url: "{{baseUrl}}/api/persons"
method: GET
scripts:
  - type: afterResponse
    code: |2-
            // Uden count ved vi ikke, hvor mange personer der ønskes. OBS: bekræft med gruppen at 400 er aftalt
            pm.test("BULK-13: Manglende count afvises med status 400", function () {
                pm.response.to.have.status(400);
            });
       
            // Et afvist kald må ikke returnere en liste af personer
            pm.test("BULK-13: Svaret indeholder ikke personer", function () {
                let body = null;
       
                try {
                    body = pm.response.json();
                } catch (error) {
                    // Fejlsvaret er ikke JSON. Det er i orden, da formatet ikke er aftalt.
                }
       
                pm.expect(Array.isArray(body)).to.equal(false);
            });
    language: text/javascript
