$kind: http-request
url: "{{baseUrl}}/api/persons"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("BULK-13: Manglende count giver status 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("BULK-13: Manglende count giver præcis 2 personer", function () {
          const body = pm.response.json();

          pm.expect(body).to.be.an("array");
          pm.expect(body.length).to.equal(2);
      });

      pm.test("BULK-13: Alle adresser er uden foranstillede nuller", function () {
          const persons = pm.response.json();

          pm.expect(persons).to.be.an("array");

          persons.forEach(function (person, index) {
              const address = person.address;
              const label = "Person " + (index + 1);

              pm.expect(address.number, label + ": husnummer")
                  .to.be.a("string");
              pm.expect(address.number, label + ": husnummer")
                  .to.match(/^[1-9]/);

              pm.expect(address.door, label + ": dør")
                  .to.be.a("string");

              if (/^[0-9]+$/.test(address.door)) {
                  pm.expect(address.door, label + ": numerisk dør")
                      .to.match(/^[1-9]/);
              }
          });
      });
    language: text/javascript
order: 4503563763554798
